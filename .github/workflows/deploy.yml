name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Type checking
        run: pnpm typecheck
        
      - name: Linting
        run: pnpm lint
        
      - name: Unit tests
        run: pnpm test
        
      - name: Build packages
        run: pnpm build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest
        
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Project Artifacts
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Deploy Project Artifacts
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "### 🚀 Deployment Success" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to: [$url]($url)" >> $GITHUB_STEP_SUMMARY
          
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎯 Preview Deployment Ready!
              
              **🔗 Preview URL**: ${{ steps.deploy.outputs.url }}
              
              ### ✅ What's New in M4:
              - 🃏 **Enhanced Card Experience** - Animated card draws with flip effects
              - 🏛️ **Auction Interface** - Real-time bidding with AI rationale display  
              - 🤝 **Trading System** - Complete trade negotiation with asset picker
              - 📖 **Tutorial & Help** - Interactive tutorial for new players
              - 📱 **Mobile Optimized** - Touch-friendly controls and responsive design
              - 📡 **WebSocket Telemetry** - Event streaming for analytics and multiplayer prep
              
              **🧪 Test the game**: Click the preview link and start a new game to experience all M4 features!
              
              ---
              *Preview automatically updates with new commits to this PR*`
            })

  e2e-test:
    name: End-to-End Testing
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Install Playwright Browsers
        run: npx -y @playwright/test@latest install chromium
        
      - name: Run Playwright tests
        run: |
          # Create basic smoke test for the deployed preview
          cat > smoke.spec.ts << 'EOF'
          import { test, expect } from '@playwright/test';
          
          const PREVIEW_URL = process.env.PREVIEW_URL || 'http://localhost:5173';
          
          test('Monopoly game loads and displays correctly', async ({ page }) => {
            await page.goto(PREVIEW_URL);
            
            // Check if the game loads
            await expect(page.locator('h1')).toContainText('Monopoly');
            
            // Check if we can start a game  
            await page.fill('input[placeholder="seed"]', 'test-seed');
            await page.click('button:text("Start")');
            
            // Check if the 3D board renders
            await expect(page.locator('canvas')).toBeVisible();
            
            // Check if game controls appear
            await expect(page.locator('button:text("Roll")')).toBeVisible({ timeout: 5000 });
          });
          
          test('Mobile layout works correctly', async ({ page }) => {
            await page.setViewportSize({ width: 375, height: 667 }); // iPhone size
            await page.goto(PREVIEW_URL);
            
            // Check mobile-specific elements
            await page.fill('input[placeholder="seed"]', 'mobile-test');
            await page.click('button:text("Start")');
            
            // Verify mobile classes are applied
            const body = await page.locator('body').first();
            await expect(body).toHaveClass(/mobile/);
          });
          EOF
          
          npx -y @playwright/test@latest test smoke.spec.ts --project chromium
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}